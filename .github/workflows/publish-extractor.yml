name: Publish game-data extractor image (GHCR)

# Builds the game-data extractor (tools/game-data-extractor/) — the ported
# PalworldDataExtractor fork + convert.py — and pushes it to
# ghcr.io/<owner>/palworld-data-extractor. It ships only the extractor/converter;
# the game pak and usmap are mounted at run time, so nothing of Pocketpair's is
# baked in. Runs on version tags (v*) and manual dispatch.

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      # Rebuild only when the extractor tool or this workflow changes — not on
      # every unrelated main push. Version tags always build (see above).
      - 'tools/game-data-extractor/**'
      - 'scripts/pde/**'
      - '.github/workflows/publish-extractor.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        # The net10 self-contained publish + CUE4Parse deps are large; the stock
        # runner's ~14 GB free on / isn't enough. Reclaim the preinstalled
        # toolchains we don't use (~25 GB) so the build has headroom.
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "after:"; df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/palworld-data-extractor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/game-data-extractor/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
