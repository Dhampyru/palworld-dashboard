# LOCAL PREVIEW HARNESS (not committed) — second dashboard on :3001 from the current
# branch, for reviewing UI changes before they touch live :3000. Read-only game dir
# + its own copied data volume, so nothing here can change the live server.
# Tear down: docker compose -f docker-compose.preview.yml down
name: palworld-dashboard-preview

services:
  preview:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GAME_SERVER_IP: ${NEXT_PUBLIC_GAME_SERVER_IP:?set in .env}
    image: palworld-server-dashboard:preview
    container_name: palworld-dashboard-preview
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      PANEL_INITIAL_ADMIN_PASSWORD: ${PANEL_INITIAL_ADMIN_PASSWORD:?}
      PALWORLD_ADMIN_PASSWORD: ${PALWORLD_ADMIN_PASSWORD:?}
      PANEL_INITIAL_MOD_PASSWORD: ${PANEL_INITIAL_MOD_PASSWORD:-}
      PALWORLD_REST_URL: ${PALWORLD_REST_URL:-http://host.docker.internal:8212}
      PALDEFENDER_REST_URL: ${PALDEFENDER_REST_URL:-http://host.docker.internal:17993}
      PALDEFENDER_REST_TOKEN: ${PALDEFENDER_REST_TOKEN:-}
      PANEL_AUTH_FILE: /app/data/panel-auth.json
      RATE_LIMIT_TRUST_PROXY: ${RATE_LIMIT_TRUST_PROXY:-false}
      DEMO_MODE: ${DEMO_MODE:-0}
      PALWORLD_FPS_HISTORY_FILE: /metrics/fps-history.json
      PALWORLD_GAME_DIR: /palworld-game
      PALWORLD_CHAT_LOG_FILE: /palworld-game/console.log
      PALWORLD_CHAT_LOG_MAX_BYTES: "524288"
      PALWORLD_REGISTRY_PATH: ${PALWORLD_REGISTRY_PATH:-/srv/palworld/registry.json}
    volumes:
      - palworld-dashboard-preview-data:/app/data
      - fps-metrics-live:/metrics:ro
      - /root/palworld-server/game:/palworld-game:ro
      - /root/palworld-server/.env:/palworld-server-env/.env:ro
      - /run/palworld:/run/palworld:ro
      # Multi-instance (#7): registry + instance dirs, read-only in the preview.
      - /srv/palworld:/srv/palworld:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  palworld-dashboard-preview-data:
    external: true
  fps-metrics-live:
    external: true
    name: palworld-server-dashboard_palworld-fps-metrics
